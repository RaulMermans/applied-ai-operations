name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI is verification only: it typechecks, lints, builds, and tests the
# repository, in that order — build runs before test because workspace
# packages resolve each other at runtime via their compiled dist/ output
# (package.json "main"), not their TypeScript source. It does not deploy,
# publish, release, or provision anything.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
