# Runtime foundation dataset (EvalDataset schema version 2).
# Cases are stable, human-assigned regression identities; never renumber or
# reuse an id. Each case references evidence (resolved by the host) instead
# of embedding it, and states the exact verdict it exists to prove:
# `passed` (desired behavior), `failed` + the reasonCodes it detects
# (forbidden behavior), or `error` + its errorCode (untrustworthy or
# insufficient evidence must never pass).
#
# Every OFFLINE case pins the SHA-256 evidenceFingerprint of the fixture it
# was written against. A fixture whose content changes without a deliberate
# re-pin here is EVAL_FIXTURE_FINGERPRINT_MISMATCH and is not evaluated.
# Re-pinning (or any case change) requires a new dataset version.
#
# Migrated from schema version 1 (aao.runtime-foundation@1.1.0) in Sprint 18:
# same 35 cases, same evidence, fingerprints pinned, failed expectations
# made exact (ADR-023).
schemaVersion: 2
id: aao.runtime-foundation
version: "2.0.0"
name: AAO runtime foundation
description: High-signal desired and forbidden behaviors of the AAO runtime foundation (Trace, Run, trajectory, Tools, Approval, Authorization, retries, state, Metrics, portability).
