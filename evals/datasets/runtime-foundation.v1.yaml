# Runtime foundation dataset (EvalDataset schema version 1).
# Cases are stable, human-assigned regression identities; never renumber or
# reuse an id. Each case references evidence (resolved by the host) instead
# of embedding it, and states the verdict it exists to prove: `passed`
# (desired behavior), `failed` (forbidden behavior detected), or `error`
# (untrustworthy or insufficient evidence must never pass).
schemaVersion: 1
id: aao.runtime-foundation
version: "1.0.0"
name: AAO runtime foundation
description: High-signal desired and forbidden behaviors of the AAO runtime foundation (Trace, Run, trajectory, Tools, Approval, Authorization, retries, state, Metrics, portability).
cases:
  # --- Trace integrity ---
  - id: trace.flagship-approved-valid.001
    evalRef: { id: trace.contract-valid, version: "1.0.0" }
    mode: OFFLINE
    evidenceRef: fixture://flagship-approved
    expected: { status: passed }
    tags: [trace]
  - id: trace.corrupt-sequence-gap.001
    evalRef: { id: trace.contract-valid, version: "1.0.0" }
    mode: OFFLINE
    evidenceRef: fixture://corrupt-trace-gap
    expected: { status: failed }
    tags: [trace, negative]
  - id: trace.corrupt-evidence-not-judged.001
    name: A corrupt Trace is untrustworthy evidence for a Tool eval, never a pass or a behavior failure
    evalRef: { id: tool.lookup-required, version: "1.0.0" }
    mode: OFFLINE
    evidenceRef: fixture://corrupt-trace-gap
    expected: { status: error, errorCode: EVAL_EVIDENCE_INVALID }
    tags: [trace, evaluator-error]

  # --- Run / trajectory ---
  - id: run.flagship-completed.001
    evalRef: { id: run.completed, version: "1.0.0" }
