    mode: OFFLINE
    evidenceRef: fixture://negative-tool-after-rejection
    expected: { status: failed }
    tags: [trajectory, approval, negative]

  # --- Tool usage ---
  - id: tool.required-lookup-invoked.001
    evalRef: { id: tool.lookup-required, version: "1.0.0" }
    mode: OFFLINE
