    tags: [tool, authorization]
  - id: tool.missing-trace-not-passed.001
    name: Without Trace evidence a Tool eval is an error, never a pass
    evalRef: { id: tool.lookup-required, version: "1.0.0" }
    mode: OFFLINE
    evidenceRef: fixture://execution-only
    expected: { status: error, errorCode: EVAL_EVIDENCE_MISSING }
    tags: [tool, evaluator-error]

  # --- Approval ---
  - id: approval.required-and-approved.001
