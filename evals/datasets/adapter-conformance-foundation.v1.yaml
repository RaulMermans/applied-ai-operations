# Adapter conformance foundation dataset (EvalDataset schema version 2).
# One case = one canonical scenario (evidence `scenario://<id>`, produced by
# a substrate's own test driver at verification time) judged by one
# conformance definition. RUNTIME cases: each driver executes a real local
# AAO Run, so evidence is never fixture-pinned. A driver that declares a
# scenario SUPPORTED must match every case of it; UNSUPPORTED and
# NOT_APPLICABLE scenarios are reported as such, never as passes.
schemaVersion: 2
id: aao.adapter-conformance-foundation
version: "1.0.0"
name: AAO adapter conformance foundation
description: High-signal canonical behaviors every Tool or model substrate must preserve when mapped into AAO evidence (identity, errors, Tools, authority, Trace, output mapping).
cases:
  # --- Tool / capability substrates ---
  - id: tool.success.trace-valid.001
    evalRef: { id: conformance.trace-valid, version: "1.0.0" }
    mode: RUNTIME
    evidenceRef: scenario://tool.success-structured-result
    expected: { status: passed }
  - id: tool.success.run-completed.001
    evalRef: { id: conformance.run-completed, version: "1.0.0" }
    mode: RUNTIME
    evidenceRef: scenario://tool.success-structured-result
    expected: { status: passed }
  - id: tool.success.invoked-once.001
