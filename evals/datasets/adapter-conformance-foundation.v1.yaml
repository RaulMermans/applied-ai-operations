  - id: tool.transient.run-completed.001
    evalRef: { id: conformance.run-completed, version: "1.0.0" }
    mode: RUNTIME
    evidenceRef: scenario://tool.transient-retry
    expected: { status: passed }

  # --- Model substrates ---
